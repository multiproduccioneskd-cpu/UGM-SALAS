<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checklist Salas UGM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #2b3a4a; background-image: linear-gradient(135deg, #233040 25%, #1a2430 100%); color: #1f2937; min-height: 100vh; font-family: sans-serif; }
        .vista { display: none; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .input-field { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; font-size: 16px; }
        header { background-color: #111e38; color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-left: 5px solid #d4af37; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .select-universal { background-color: #f8fafc; font-weight: bold; color: #1e293b; border: 2px solid #e2e8f0; }
    </style>
</head>
<body class="p-4">

    <header>
        <div class="header-titles">
            <h1 class="font-bold text-lg leading-none">CHECKLIST SALAS UGM</h1>
            <p class="text-[10px] opacity-70 uppercase mt-1">Gestión Técnica Audiovisual</p>
        </div>
        <div id="reloj" class="text-right text-[10px] font-mono text-yellow-400 font-bold"></div>
    </header>

    <div id="pantallaPrincipal" class="space-y-4">
        <button onclick="abrirVista('formNuevo')" class="w-full bg-[#166534] text-white p-6 rounded-lg font-bold shadow-lg text-lg border-b-4 border-green-900 active:scale-95 transition-all">➕ INICIAR NUEVO CHECKLIST</button>
        <button onclick="abrirVista('formActualizar')" class="w-full bg-[#1e40af] text-white p-6 rounded-lg font-bold shadow-lg text-lg border-b-4 border-blue-900 active:scale-95 transition-all">🔄 ACTUALIZAR SALA EXISTENTE</button>
        <button onclick="abrirVista('formUniversal')" class="w-full bg-[#92400e] text-white p-6 rounded-lg font-bold shadow-lg text-lg border-b-4 border-orange-900 active:scale-95 transition-all">📋 CHECKLIST UNIVERSAL (RÁPIDO)</button>
    </div>

    <div id="formUniversal" class="vista card">
        <h2 class="font-bold text-orange-900 mb-4 uppercase text-sm border-b pb-2 italic">📋 Revisión Rápida (Universal)</h2>
        <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase">Sala</label>
                    <input type="text" id="u_sala" placeholder="Ej: Sala 102" class="input-field border-orange-200">
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase">Responsable</label>
                    <input type="text" id="u_tecnico" placeholder="Tu nombre" class="input-field border-orange-200">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase">Fecha Registro</label>
                    <input type="text" id="u_fecha_registro" class="input-field select-universal text-sm opacity-70" readonly>
                </div>
                <div>
                    <label class="text-xs font-bold text-gray-600 uppercase">Hora Registro</label>
                    <input type="text" id="u_hora_registro" class="input-field select-universal text-sm opacity-70" readonly>
                </div>
            </div>

            <button onclick="guardar('UNIVERSAL')" class="w-full bg-orange-700 text-white py-4 rounded-lg font-bold shadow-xl border-b-4 border-orange-900">ENVIAR REVISIÓN</button>
        </div>
    </div>

    <script>
        // Actualizamos la fecha y hora automáticamente
        setInterval(() => {
            const now = new Date();
            document.getElementById('reloj').innerText = now.toLocaleString();
            document.getElementById('u_hora_registro').value = now.toLocaleTimeString();
            document.getElementById('u_fecha_registro').value = now.toLocaleDateString();
        }, 1000);
        
        // ... (resto de funciones)
    </script>
</body>
</html>
