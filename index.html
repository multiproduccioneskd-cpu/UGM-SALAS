<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salas UGM - Gestión AV</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <header class="bg-blue-900 p-6 text-white shadow-lg">
        <h1 class="text-2xl font-bold">Salas UGM</h1>
        <p class="opacity-80">Revisión de Equipamiento Audiovisual</p>
    </header>

    <div class="max-w-md mx-auto p-4">
        <input type="text" id="buscador" placeholder="Buscar sala por nombre..." 
               class="w-full p-3 border rounded-lg mb-4 shadow-sm" onkeyup="filtrarSalas()">

        <div id="app" class="space-y-4">
            <p class="text-center text-gray-500">Cargando salas...</p>
        </div>
    </div>

    <script>
        // PEGA TU URL DE GOOGLE APPS SCRIPT AQUÍ
        const url = 'TU_URL_AQUÍ_QUE_TERMINA_EN_/exec'; 
        let listaSalas = [];

        async function cargarSalas() {
            try {
                const response = await fetch(url);
                listaSalas = await response.json();
                renderizar(listaSalas);
            } catch (error) {
                document.getElementById('app').innerHTML = '<p class="text-red-500 text-center">Error de conexión. Verifica la URL o los permisos.</p>';
                console.error(error);
            }
        }

        function renderizar(data) {
            const contenedor = document.getElementById('app');
            contenedor.innerHTML = '';
            
            data.forEach(sala => {
                const nombre = sala['Nombre Sala'] || 'Sin nombre';
                const hdmi = sala['Estado HDMI'] || 'N/A';
                const switchE = sala['Estado Switch'] || 'N/A';
                const equipos = sala['Estado Equipos/Periféricos'] || 'N/A';
                
                const card = `
                    <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-blue-900">
                        <h2 class="font-bold text-xl">${nombre}</h2>
                        <div class="text-sm text-gray-600 mt-2">
                            <p><strong>HDMI:</strong> ${hdmi}</p>
                            <p><strong>Switch:</strong> ${switchE}</p>
                            <p><strong>Equipos:</strong> ${equipos}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-4">
                            <button class="bg-green-600 text-white py-2 rounded text-xs font-bold hover:bg-green-700">INICIAR</button>
                            <button class="bg-blue-600 text-white py-2 rounded text-xs font-bold hover:bg-blue-700">ACTUALIZAR</button>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += card;
            });
        }

        function filtrarSalas() {
            const filtro = document.getElementById('buscador').value.toLowerCase();
            const filtrados = listaSalas.filter(s => (s['Nombre Sala'] || '').toLowerCase().includes(filtro));
            renderizar(filtrados);
        }

        cargarSalas();
    </script>
</body>
</html>
