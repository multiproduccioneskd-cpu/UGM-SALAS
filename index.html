<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checklist UGM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a2333; } /* Color oscuro de tu segunda foto */
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-4">

    <div class="bg-[#1e293b] text-white p-6 rounded-lg mb-6 shadow-xl border-l-4 border-yellow-500">
        <h1 class="text-2xl font-bold">CHECKLIST DE SALAS UGM</h1>
        <p class="opacity-70">UNIVERSIDAD GABRIELA MISTRAL — GESTIÓN TÉCNICA</p>
        <p id="fechaHora" class="mt-2 font-mono text-sm"></p>
    </div>

    <div class="card">
        <h2 class="font-bold text-lg mb-4">SELECCIONE OPERACIÓN:</h2>
        <button onclick="toggle('formNuevo')" class="w-full bg-[#166534] text-white py-4 rounded-lg font-bold mb-3 shadow-lg">➕ INICIAR NUEVO CHECKLIST</button>
        <button onclick="toggle('formActualizar')" class="w-full bg-[#991b1b] text-white py-4 rounded-lg font-bold shadow-lg">🔄 ACTUALIZAR SALA EXISTENTE</button>
    </div>

    <div id="formNuevo" class="hidden card">
        <input type="text" id="nSala" placeholder="ID Sala" class="w-full p-3 border rounded mb-2">
        <button class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold">GUARDAR NUEVO</button>
    </div>

    <div id="formActualizar" class="hidden card">
        <input type="text" placeholder="🔍 Buscar sala..." class="w-full p-3 border rounded mb-4">
        <div id="lista" class="text-sm"></div>
    </div>

    <script>
        // Fecha y hora en tiempo real
        function actualizarReloj() {
            document.getElementById('fechaHora').innerText = new Date().toLocaleString();
        }
        setInterval(actualizarReloj, 1000);

        function toggle(id) {
            document.getElementById(id).classList.toggle('hidden');
        }
    </script>
</body>
</html>
