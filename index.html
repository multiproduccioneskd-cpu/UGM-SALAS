<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Salas UGM - Gestión AV</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <header class="bg-blue-900 p-6 text-white shadow-lg mb-4 rounded-b-xl">
        <h1 class="text-2xl font-bold">Salas UGM</h1>
    </header>

    <div class="bg-white p-4 rounded-lg shadow mb-4">
        <h2 class="font-bold text-blue-900 mb-3">➕ Iniciar Nuevo Checklist</h2>
        <div class="space-y-2">
            <input type="text" id="nuevaSala" placeholder="Nombre de Sala" class="w-full p-2 border rounded">
            <input type="text" id="nuevoHDMI" placeholder="Estado HDMI (OK/Falla)" class="w-full p-2 border rounded">
            <button onclick="alert('Funcionalidad de guardar en desarrollo')" class="w-full bg-green-600 text-white py-2 rounded">Guardar Nueva Revisión</button>
        </div>
    </div>

    <div class="bg-white p-4 rounded-lg shadow">
        <h2 class="font-bold text-blue-900 mb-3">🔄 Actualizar Registro</h2>
        <select id="selectHistorial" onchange="cargarDatosEnFormulario()" class="w-full p-2 border rounded mb-2">
            <option value="">Selecciona una sala registrada...</option>
        </select>
        <div id="formEditar" class="hidden space-y-2 mt-2 border-t pt-2">
            <input type="text" id="editHDMI" placeholder="Estado HDMI" class="w-full p-2 border rounded">
            <button class="w-full bg-blue-800 text-white py-2 rounded">Guardar Cambios</button>
        </div>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbycbtFHyXXU-KO8vQQ8NCN8A5k3MoOuu88qfsvZiSawZbCtjyaj0ji-wgOrJXgoMuw/exec';
        let datos = [];

        async function cargar() {
            try {
                const res = await fetch(url);
                datos = await res.json();
                
                const select = document.getElementById('selectHistorial');
                datos.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s['Nombre Sala'];
                    opt.textContent = s['Nombre Sala'];
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("Error cargando datos:", e);
            }
        }

        function cargarDatosEnFormulario() {
            const salaNombre = document.getElementById('selectHistorial').value;
            const sala = datos.find(s => s['Nombre Sala'] == salaNombre);
            if(sala) {
                document.getElementById('formEditar').classList.remove('hidden');
                document.getElementById('editHDMI').value = sala['Estado HDMI'] || '';
            }
        }

        cargar();
    </script>
</body>
</html>
