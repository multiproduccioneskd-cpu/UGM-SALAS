<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Checklist UGM - Gestión Técnica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a2333; color: white; }
        .vista { display: none; }
        .card { background: #ffffff; color: #1a2333; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .input-field { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body class="p-4">

    <div class="bg-[#1e293b] p-6 rounded-lg mb-6 shadow-xl border-l-4 border-yellow-500">
        <h1 class="text-xl font-bold uppercase">Checklist Salas UGM</h1>
        <p class="opacity-70 text-sm">UNIVERSIDAD GABRIELA MISTRAL — GESTIÓN TÉCNICA</p>
        <p id="reloj" class="text-sm font-mono mt-2 text-yellow-400"></p>
    </div>

    <div id="pantallaPrincipal" class="space-y-4">
        <button onclick="abrirVista('formNuevo')" class="w-full bg-[#166534] text-white p-6 rounded-xl font-bold text-lg shadow-lg">➕ INICIAR NUEVO CHECKLIST</button>
        <button onclick="abrirVista('formActualizar')" class="w-full bg-[#991b1b] text-white p-6 rounded-xl font-bold text-lg shadow-lg">🔄 ACTUALIZAR SALA EXISTENTE</button>
    </div>

    <div id="formNuevo" class="vista card">
        <h2 class="font-bold text-blue-900 mb-4 uppercase">➕ Nuevo Checklist</h2>
        <div class="space-y-1">
            <input type="text" id="id" placeholder="ID Sala" class="input-field">
            <input type="text" id="nombre" placeholder="Nombre Sala" class="input-field">
            <input type="number" id="hUso" placeholder="Horas de Uso" class="input-field">
            <input type="text" id="hRest" placeholder="Horas Restantes" class="input-field">
            <input type="text" id="hdmi" placeholder="Estado HDMI" class="input-field">
            <input type="text" id="sw" placeholder="Estado Switch" class="input-field">
            <input type="text" id="eq" placeholder="Estado Equipos" class="input-field">
            <input type="date" id="fUlt" class="input-field">
            <input type="date" id="fProx" class="input-field">
            <button onclick="guardar()" class="w-full bg-green-700 text-white py-4 rounded-lg font-bold">GUARDAR DATOS</button>
            <button onclick="volver()" class="w-full bg-gray-500 text-white py-2 rounded-lg mt-2">Volver</button>
        </div>
    </div>

    <div id="formActualizar" class="vista card">
        <h2 class="font-bold text-blue-900 mb-4 uppercase">🔄 Buscar y Editar</h2>
        <input type="text" id="busc" placeholder="🔍 Buscar sala..." class="input-field" onkeyup="filtrar()">
        <div id="resultados" class="space-y-2"></div>
        <button onclick="volver()" class="w-full bg-gray-500 text-white py-2 rounded-lg mt-4">Volver</button>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbycbtFHyXXU-KO8vQQ8NCN8A5k3MoOuu88qfsvZiSawZbCtjyaj0ji-wgOrJXgoMuw/exec';
        let todasLasSalas = [];

        async function cargar() {
            const res = await fetch(url);
            todasLasSalas = await res.json();
        }

        async function guardar() {
            const data = {
                id: document.getElementById('id').value,
                nombre: document.getElementById('nombre').value,
                horasUso: document.getElementById('hUso').value,
                horasRest: document.getElementById('hRest').value,
                hdmi: document.getElementById('hdmi').value,
                switch: document.getElementById('sw').value,
                equipos: document.getElementById('eq').value,
                fUlt: document.getElementById('fUlt').value,
                fProx: document.getElementById('fProx').value
            };
            await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            alert("Guardado correctamente");
            volver();
        }

        function abrirVista(id) {
            document.getElementById('pantallaPrincipal').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        }

        function volver() {
            document.querySelectorAll('.vista').forEach(v => v.style.display = 'none');
            document.getElementById('pantallaPrincipal').style.display = 'block';
        }

        function filtrar() {
            const query = document.getElementById('busc').value.toLowerCase();
            const res = document.getElementById('resultados');
            res.innerHTML = todasLasSalas.filter(s => s['Nombre Sala'].toLowerCase().includes(query)).map(s => `
                <div class="p-3 border rounded flex justify-between">
                    <span>${s['Nombre Sala']}</span>
                    <button onclick="alert('Funcionalidad de carga lista')" class="text-blue-900 font-bold">Editar</button>
                </div>`).join('');
        }

        setInterval(() => document.getElementById('reloj').innerText = new Date().toLocaleString(), 1000);
        cargar();
    </script>
</body>
</html>
