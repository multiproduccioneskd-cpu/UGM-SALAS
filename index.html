<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Salas UGM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <header class="bg-blue-900 p-6 text-white shadow-lg">
        <h1 class="text-2xl font-bold">Salas UGM</h1>
    </header>
    <div class="max-w-md mx-auto p-4">
        <input type="text" id="buscador" placeholder="Buscar sala..." class="w-full p-3 border rounded-lg mb-4" onkeyup="filtrar()">
        <div id="app" class="space-y-4">Cargando...</div>
    </div>

    <script>
        const url = 'PEGA_AQUÍ_TU_NUEVA_URL_QUE_TERMINA_EN_/exec';
        let datos = [];

        async function cargar() {
            try {
                const res = await fetch(url);
                datos = await res.json();
                render(datos);
            } catch (e) {
                document.getElementById('app').innerHTML = 'Error de conexión';
            }
        }

        function render(data) {
            const app = document.getElementById('app');
            app.innerHTML = data.map(s => `
                <div class="bg-white p-4 rounded shadow border-l-4 ${s['Estado HDMI'] === 'OK' ? 'border-green-500' : 'border-red-500'}">
                    <h2 class="font-bold text-xl">${s['Nombre Sala']}</h2>
                    <p>HDMI: ${s['Estado HDMI']} | Switch: ${s['Estado Switch']}</p>
                    <p>Equipos: ${s['Estado Equipos/Periféricos']}</p>
                </div>
            `).join('');
        }

        function filtrar() {
            const busqueda = document.getElementById('buscador').value.toLowerCase();
            render(datos.filter(s => s['Nombre Sala'].toLowerCase().includes(busqueda)));
        }

        cargar();
    </script>
</body>
</html>
