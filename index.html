<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checklist Salas UGM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #2b3a4a; background-image: linear-gradient(135deg, #233040 25%, #1a2430 100%); color: #1f2937; min-height: 100vh; font-family: sans-serif; }
        .vista { display: none; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .input-field { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; font-size: 16px; }
        header { background-color: #111e38; color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-left: 5px solid #d4af37; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body class="p-4">

    <header>
        <div class="header-titles">
            <h1 class="font-bold text-lg">CHECKLIST SALAS UGM</h1>
            <p class="text-xs opacity-70">UNIVERSIDAD GABRIELA MISTRAL — GESTIÓN TÉCNICA</p>
        </div>
        <div id="reloj" class="text-right text-xs font-mono text-yellow-400"></div>
    </header>

    <div id="pantallaPrincipal" class="space-y-4">
        <button onclick="abrirVista('formNuevo')" class="w-full bg-[#166534] text-white p-6 rounded-lg font-bold shadow-lg text-lg">➕ INICIAR NUEVO CHECKLIST</button>
        <button onclick="abrirVista('formActualizar')" class="w-full bg-[#991b1b] text-white p-6 rounded-lg font-bold shadow-lg text-lg">🔄 ACTUALIZAR SALA EXISTENTE</button>
    </div>

    <div id="formNuevo" class="vista card">
        <h2 class="font-bold text-blue-900 mb-4 uppercase text-sm">➕ Nuevo Checklist</h2>
        <input type="text" id="id" placeholder="ID Sala" class="input-field">
        <input type="text" id="nombre" placeholder="Nombre Sala" class="input-field">
        <input type="number" id="hUso" placeholder="Horas de Uso" class="input-field">
        <input type="text" id="hRest" placeholder="Horas Restantes" class="input-field">
        <input type="text" id="hdmi" placeholder="Estado HDMI" class="input-field">
        <input type="text" id="sw" placeholder="Estado Switch" class="input-field">
        <input type="text" id="eq" placeholder="Estado Equipos" class="input-field">
        <label class="text-[10px] text-gray-500 font-bold uppercase">Fecha Última Revisión</label>
        <input type="date" id="fUlt" class="input-field">
        <label class="text-[10px] text-gray-500 font-bold uppercase">Próxima Revisión</label>
        <input type="date" id="fProx" class="input-field">
        <button onclick="guardar()" class="w-full bg-green-700 text-white py-4 rounded-lg font-bold">GUARDAR DATOS</button>
        <button onclick="volver()" class="w-full bg-gray-500 text-white py-3 rounded-lg mt-2">Volver</button>
    </div>

    <div id="formActualizar" class="vista card">
        <h2 class="font-bold text-blue-900 mb-4 uppercase text-sm">🔄 Buscar Sala</h2>
        <input type="text" id="busc" placeholder="🔍 Buscar sala..." class="input-field" onkeyup="filtrar()">
        <div id="resultados" class="space-y-2 h-64 overflow-y-auto"></div>
        <button onclick="volver()" class="w-full bg-gray-500 text-white py-3 rounded-lg mt-4">Volver</button>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbycbtFHyXXU-KO8vQQ8NCN8A5k3MoOuu88qfsvZiSawZbCtjyaj0ji-wgOrJXgoMuw/exec';
        let todasLasSalas = [];

        async function cargar() { const res = await fetch(url); todasLasSalas = await res.json(); }
        
        setInterval(() => document.getElementById('reloj').innerText = new Date().toLocaleString(), 1000);
        
        function abrirVista(id) { document.getElementById('pantallaPrincipal').style.display = 'none'; document.getElementById(id).style.display = 'block'; }
        function volver() { document.querySelectorAll('.vista').forEach(v => v.style.display = 'none'); document.getElementById('pantallaPrincipal').style.display = 'block'; }

        async function guardar() {
            const data = {
                id: document.getElementById('id').value, nombre: document.getElementById('nombre').value,
                horasUso: document.getElementById('hUso').value, horasRest: document.getElementById('hRest').value,
                hdmi: document.getElementById('hdmi').value, switch: document.getElementById('sw').value,
                equipos: document.getElementById('eq').value, fUlt: document.getElementById('fUlt').value, fProx: document.getElementById('fProx').value
            };
            await fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            alert("Guardado correctamente"); volver();
        }

        function filtrar() {
            const query = document.getElementById('busc').value.toLowerCase();
            const res = document.getElementById('resultados');
            res.innerHTML = todasLasSalas.filter(s => s['Nombre Sala'].toLowerCase().includes(query)).map(s => `
                <div class="p-4 border rounded flex justify-between items-center bg-gray-50">
                    <span class="font-bold text-sm">${s['Nombre Sala']}</span>
                    <button onclick="alert('Cargando: ${s['Nombre Sala']}')" class="bg-blue-900 text-white px-4 py-2 rounded text-sm">Editar</button>
                </div>`).join('');
        }
        cargar();
    </script>
</body>
</html>
