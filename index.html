<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salas UGM App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1a2333; }
        .card { background: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-field { width: 100%; padding: 10px; margin: 4px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body class="p-4">
    <header class="bg-[#1e293b] text-white p-6 rounded-lg mb-6 shadow-xl border-l-4 border-yellow-500">
        <h1 class="text-xl font-bold uppercase">Checklist Salas UGM</h1>
    </header>

    <div class="card">
        <h2 id="tituloForm" class="font-bold text-blue-900 mb-3 uppercase text-sm">➕ Nuevo Checklist</h2>
        <div id="formNuevo" class="space-y-1">
            <input type="text" id="id" placeholder="ID Sala" class="input-field">
            <input type="text" id="nombre" placeholder="Nombre Sala" class="input-field">
            <input type="number" id="hUso" placeholder="Horas de Uso" class="input-field">
            <input type="text" id="hRest" placeholder="Horas Restantes" class="input-field">
            <input type="text" id="hdmi" placeholder="Estado HDMI" class="input-field">
            <input type="text" id="sw" placeholder="Estado Switch" class="input-field">
            <input type="text" id="eq" placeholder="Estado Equipos" class="input-field">
            <label class="text-[10px] text-gray-500 font-bold uppercase">Fecha Última Revisión</label>
            <input type="date" id="fUlt" class="input-field">
            <label class="text-[10px] text-gray-500 font-bold uppercase">Próxima Revisión</label>
            <input type="date" id="fProx" class="input-field">
            <button onclick="guardar()" class="w-full bg-green-700 text-white py-4 rounded-xl font-bold mt-4">GUARDAR DATOS</button>
        </div>
    </div>

    <div class="card">
        <h2 class="font-bold text-blue-900 mb-3 uppercase text-sm">🔄 Actualizar Sala</h2>
        <input type="text" id="busc" placeholder="🔍 Buscar sala por nombre..." class="input-field" onkeyup="filtrar()">
        <div id="lista" class="mt-2 space-y-2"></div>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbycbtFHyXXU-KO8vQQ8NCN8A5k3MoOuu88qfsvZiSawZbCtjyaj0ji-wgOrJXgoMuw/exec';
        let todasLasSalas = [];

        // Cargar salas al iniciar
        async function cargar() {
            const res = await fetch(url);
            todasLasSalas = await res.json();
        }

        // Filtrar y mostrar lista
        function filtrar() {
            const query = document.getElementById('busc').value.toLowerCase();
            const lista = document.getElementById('lista');
            lista.innerHTML = '';
            todasLasSalas.filter(s => s['Nombre Sala'].toLowerCase().includes(query)).forEach(s => {
                lista.innerHTML += `
                    <div class="p-3 border rounded flex justify-between items-center">
                        <span>${s['Nombre Sala']}</span>
                        <button onclick="cargarEnFormulario('${s['Nombre Sala']}')" class="bg-blue-900 text-white px-3 py-1 rounded text-sm">Editar</button>
                    </div>`;
            });
        }

        // Cargar datos en el formulario
        function cargarEnFormulario(nombre) {
            const sala = todasLasSalas.find(s => s['Nombre Sala'] === nombre);
            document.getElementById('id').value = sala['ID Sala'];
            document.getElementById('nombre').value = sala['Nombre Sala'];
            document.getElementById('hUso').value = sala['Horas de Uso'];
            document.getElementById('hRest').value = sala['Horas Restantes'];
            document.getElementById('hdmi').value = sala['Estado HDMI'];
            document.getElementById('sw').value = sala['Estado Switch'];
            document.getElementById('eq').value = sala['Estado Equipos/Periféricos'];
            document.getElementById('tituloForm').innerText = '🔄 Editando: ' + nombre;
            window.scrollTo(0,0);
        }

        async function guardar() { /* Tu función de guardar igual que antes */ }

        cargar();
    </script>
</body>
</html>
